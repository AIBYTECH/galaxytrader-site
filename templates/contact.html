{% extends "base.html" %}
{% block title %}Contact | {{ cfg.SITE_NAME }}{% endblock %}
{% block content %}
<div class="wrap section prose">
  <h1>Contact us</h1>
  <div class="contact-cards">
    <a class="contact-card" href="https://wa.me/{{ cfg.WHATSAPP_NUMBER }}" rel="noopener" data-wa-click="contact"><strong>WhatsApp</strong>{{ cfg.WHATSAPP_DISPLAY }}</a>
    <a class="contact-card" href="mailto:{{ cfg.EMAIL }}"><strong>Email</strong>{{ cfg.EMAIL }}</a>
    <div class="contact-card"><strong>Shop</strong>{{ cfg.ADDRESS }}</div>
    <div class="contact-card"><strong>Hours</strong>{{ cfg.HOURS }}</div>
  </div>
</div>
{% endblock %}
