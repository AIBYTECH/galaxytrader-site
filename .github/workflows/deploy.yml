# Build the catalogue and deploy it to Cloudflare Pages.
#   push to "main"    -> live site (galaxytraderco.com)
#   push to "staging" -> preview URL (staging.galaxytrader.pages.dev)
#
# Steps: npm run build (its "prebuild" step runs Python, which validates the
# workbook and writes JSON; then Astro builds the static pages into dist/)
# -> wrangler uploads dist/ plus functions/ (the /api/click Pages Function)
# to the Pages project "galaxytrader".
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# and repository variables WHATSAPP_NUMBER, WHATSAPP_DISPLAY, IMG_BASE_URL.
name: Build and deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      BASE_URL: https://galaxytraderco.com
      IMG_BASE_URL: ${{ vars.IMG_BASE_URL }}
      WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
      WHATSAPP_DISPLAY: ${{ vars.WHATSAPP_DISPLAY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python packages
        run: pip install -r requirements.txt

      # "npm run build" first runs the "prebuild" script, which is
      # "python build.py --emit-json": it validates the workbook and writes
      # the JSON. Validation errors stop the build here.
      - name: Validate the workbook and build the site
        run: |
          npm ci
          npm run build

      - name: Keep the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: build/validation_report.csv
          if-no-files-found: ignore

      # functions/ sits next to dist/ in the project root, so wrangler
      # deploys the /api/click function together with the pages.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=galaxytrader --branch=${{ github.ref_name }}
