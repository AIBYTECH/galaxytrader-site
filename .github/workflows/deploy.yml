# Build the catalogue and deploy it to Cloudflare Pages.
#   push to "main"    -> live site (galaxytraderco.com)
#   push to "staging" -> preview URL (staging.galaxytrader.pages.dev)
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# and repository variables WHATSAPP_NUMBER, WHATSAPP_DISPLAY, IMG_BASE_URL.
name: Build and deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      BASE_URL: https://galaxytraderco.com
      IMG_BASE_URL: ${{ vars.IMG_BASE_URL }}
      WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
      WHATSAPP_DISPLAY: ${{ vars.WHATSAPP_DISPLAY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate workbook and build site
        run: python build.py

      - name: Keep the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: build/validation_report.csv
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=galaxytrader --branch=${{ github.ref_name }}
